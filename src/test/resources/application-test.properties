spring.application.name=rolemanagement

# The critical fix: ADD ;NON_KEYWORDS=USERS,USER,PASSWORD to the URL
# Also set the MODE to MySQL or PostgreSQL which are more relaxed
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USERS,USER,PASSWORD
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable all migrations
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Let Hibernate build the schema
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Ensure no external SQL files run
spring.sql.init.mode=never